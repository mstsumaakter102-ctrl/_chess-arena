<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2833" />
      <stop offset="85%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="100%" stop-color="#45A29E" />
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#66FCF1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGlow)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#66FCF1" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Antigravity Orbital Ring -->
  <ellipse cx="96" cy="100" rx="68" ry="24" fill="none" stroke="url(#purpleRing)" stroke-width="3" transform="rotate(-22 96 100)" stroke-dasharray="14 6" opacity="0.85" filter="url(#glow)" />

  <!-- Quantum Particle Nodes -->
  <circle cx="38" cy="85" r="3" fill="#66FCF1" filter="url(#glow)" />
  <circle cx="154" cy="115" r="3.5" fill="#66FCF1" filter="url(#glow)" />
  <circle cx="96" cy="36" r="2.5" fill="#45A29E" />

  <!-- Regal Chess King / Crown Silhouette -->
  <g filter="url(#glow)">
    <!-- Base -->
    <path d="M60 136 h72 v8 c0 3 -3 6 -6 6 H66 c-3 0 -6 -3 -6 -6 Z" fill="url(#neonCyan)" />
    <!-- Pedestal -->
    <path d="M68 136 L74 122 h44 L124 136 Z" fill="#1F2833" stroke="url(#neonCyan)" stroke-width="2" />
    <!-- Crown Peaks -->
    <path d="M72 120 L62 82 L82 102 L96 70 L110 102 L130 82 L120 120 Z" fill="url(#neonCyan)" />
    <!-- Floating Cross / Singularity Orb -->
    <path d="M96 52 v14 M89 59 h14" stroke="#66FCF1" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="96" cy="59" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
