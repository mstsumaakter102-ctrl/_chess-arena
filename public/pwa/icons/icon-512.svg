<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1F2833" />
      <stop offset="70%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="neonCyan512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="50%" stop-color="#45A29E" />
      <stop offset="100%" stop-color="#38B2AC" />
    </linearGradient>
    <linearGradient id="purpleRing512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#66FCF1" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow512)" />
  <rect width="506" height="506" x="3" y="3" rx="110" fill="none" stroke="#66FCF1" stroke-width="3" stroke-opacity="0.35" />

  <!-- Multiple Quantum Gravity Rings -->
  <ellipse cx="256" cy="270" rx="185" ry="65" fill="none" stroke="url(#purpleRing512)" stroke-width="6" transform="rotate(-24 256 270)" stroke-dasharray="32 16" opacity="0.85" filter="url(#glow512)" />
  <ellipse cx="256" cy="270" rx="140" ry="48" fill="none" stroke="#66FCF1" stroke-width="2" transform="rotate(18 256 270)" stroke-dasharray="16 12" opacity="0.5" />

  <!-- Quantum Particle Nodes -->
  <circle cx="100" cy="230" r="8" fill="#66FCF1" filter="url(#glow512)" />
  <circle cx="410" cy="310" r="9" fill="#9D4EDD" filter="url(#glow512)" />
  <circle cx="256" cy="95" r="7" fill="#66FCF1" filter="url(#glow512)" />

  <!-- Regal Chess King / Crown Silhouette -->
  <g filter="url(#glow512)">
    <!-- Base -->
    <path d="M160 365 h192 v22 c0 8 -8 16 -16 16 H176 c-8 0 -16 -8 -16 -16 Z" fill="url(#neonCyan512)" />
    <!-- Pedestal -->
    <path d="M182 365 L198 325 h116 L330 365 Z" fill="#1F2833" stroke="url(#neonCyan512)" stroke-width="5" />
    <!-- Crown Peaks -->
    <path d="M192 320 L166 218 L218 272 L256 186 L294 272 L346 218 L320 320 Z" fill="url(#neonCyan512)" />
    <!-- Floating Cross / Singularity Orb -->
    <path d="M256 138 v38 M237 157 h38" stroke="#66FCF1" stroke-width="9" stroke-linecap="round" />
    <circle cx="256" cy="157" r="12" fill="#FFFFFF" />
  </g>
</svg>
